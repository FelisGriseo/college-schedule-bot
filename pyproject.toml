[project]
name = "college-schedule-bot"
version = "0.1.0"
description = "Telegram bot for college schedules and schedule replacements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4.0",
    "aiosqlite>=0.20.0",
    "easyocr>=1.7.2",
    "openpyxl>=3.1.5",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "telethon>=1.37.0",
]

[project.scripts]
college-schedule-bot = "main:main"

[tool.uv]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["database", "handlers", "keyboards", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
